<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:PF;src:url(font6.ttf);font-weight:700;}
@font-face{font-family:PF;src:url(font7.ttf);font-weight:800;}
@font-face{font-family:PF;src:url(font5.ttf);font-weight:700;font-style:italic;}
@font-face{font-family:IN;src:url(font4.ttf);font-weight:400;}
@font-face{font-family:IN;src:url(font2.ttf);font-weight:600;}
@font-face{font-family:IN;src:url(font1.ttf);font-weight:700;}
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1200px;height:1200px;overflow:hidden;background:#0c2a2a;font-family:IN;position:relative;}
body::before{content:"";position:absolute;inset:0;
  background:radial-gradient(900px 620px at 50% 30%, rgba(212,180,99,.16), transparent 64%);}
.top{position:relative;padding:74px 88px 0;text-align:center;}
.eyebrow{font-size:20px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#d4b463;}
h1{font-family:PF;font-weight:800;font-size:82px;line-height:1.03;color:#f6f1e4;letter-spacing:-.024em;margin-top:24px;}
h1 em{font-style:italic;font-weight:700;color:#d4b463;}
.sub{font-family:PF;font-style:italic;font-weight:700;font-size:31px;color:#a9bfb6;margin-top:24px;}
.pill{display:inline-block;margin-top:32px;font-size:17px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:#0c2a2a;background:#d4b463;padding:11px 24px;border-radius:100px;}
.stage{position:absolute;left:0;right:0;bottom:0;height:700px;}
.sheet{position:absolute;left:50%;border-radius:4px 4px 0 0;overflow:hidden;bottom:-100px;}
.back2{width:500px;margin-left:-186px;transform:rotate(3.4deg);transform-origin:bottom center;background:#d8d2c4;height:740px;box-shadow:0 -14px 60px rgba(0,0,0,.4);}
.back1{width:514px;margin-left:-320px;transform:rotate(-2.8deg);transform-origin:bottom center;background:#ece7db;height:756px;box-shadow:0 -16px 66px rgba(0,0,0,.44);}
.front{width:560px;margin-left:-280px;box-shadow:0 -26px 96px rgba(0,0,0,.62);}
.front img{display:block;width:100%;height:auto;}
</style>
<div class="top">
  <div class="eyebrow">Free download</div>
  <h1>The DELF B1<br><em>Cheat Sheet</em></h1>
  <div class="sub">Everything that decides your score.</div>
  <div class="pill">4-page PDF</div>
</div>
<div class="stage">
  <div class="sheet back2"></div>
  <div class="sheet back1"></div>
  <div class="sheet front"><img src="cheat-sheet-cover.jpg"></div>
</div>
